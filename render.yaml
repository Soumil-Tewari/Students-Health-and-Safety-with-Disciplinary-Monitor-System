services:
  - type: web
    name: students-health-and-safety-with-disciplinary-monitor-system
    env: node
    region: oregon
    plan: free
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
